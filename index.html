<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1A2332">
<link rel="icon" href="/favicon.png" type="image/png">
<title>GrowthLever — Client Dashboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --coral: #FF6B6B;
  --coral-hover: #FF5252;
  --yellow: #FFD96B;
  --midnight: #1A2332;
  --midnight-light: #253044;
  --midnight-lighter: #2F3D56;
  --text-primary: #FFFFFF;
  --text-secondary: #8D99AE;
  --text-muted: #636E80;
}
body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--midnight);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Nav — mirrors growthlever.app */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 2rem;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}
.nav-logo img { height: 32px; }
.nav-links {
  display: flex;
  align-items: center;
  gap: 2rem;
}
.nav-links a {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text-secondary);
  text-decoration: none;
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--text-primary); }
.nav-links a.active { color: var(--text-primary); }
.nav-cta {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--midnight) !important;
  background: var(--coral);
  padding: 0.5rem 1.15rem;
  border-radius: 8px;
  transition: background 0.2s;
}
.nav-cta:hover { background: var(--coral-hover); color: var(--midnight) !important; }

/* Main content */
.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 4rem 2rem;
}
.hero h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 2.5rem;
  font-weight: 700;
  margin-bottom: 1rem;
  letter-spacing: -0.02em;
}
.hero h1 span { color: var(--coral); }
.hero p {
  color: var(--text-secondary);
  font-size: 1.1rem;
  max-width: 480px;
  line-height: 1.7;
  margin-bottom: 2.5rem;
}
.hero .email-link {
  color: var(--coral);
  text-decoration: none;
  font-weight: 600;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}
.hero .email-link:hover { border-bottom-color: var(--coral); }
.hero .cta-btn {
  display: inline-block;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  color: var(--midnight);
  background: var(--coral);
  padding: 0.85rem 2rem;
  border-radius: 10px;
  text-decoration: none;
  transition: background 0.2s, transform 0.15s;
}
.hero .cta-btn:hover { background: var(--coral-hover); transform: translateY(-1px); }

/* Footer */
.footer {
  padding: 1.5rem 2rem;
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-muted);
  border-top: 1px solid var(--midnight-lighter);
}

/* Mobile */
@media (max-width: 640px) {
  .nav { padding: 1rem; }
  .nav-links { gap: 1rem; }
  .nav-links a:not(.nav-cta) { display: none; }
  .hero h1 { font-size: 1.75rem; }
  .hero p { font-size: 1rem; }
}
</style>
</head>
<body>

<!-- Nav — matches growthlever.app -->
<nav class="nav">
  <a href="https://growthlever.app" class="nav-logo"><img src="/logo-full.png" alt="GrowthLever"></a>
  <div class="nav-links">
    <a href="https://growthlever.app/about">About</a>
    <a href="https://growthlever.app/services">Services</a>
    <a href="https://growthlever.app/audit">Free Audit</a>
    <a class="active" href="/">Clients</a>
    <a href="https://calendar.google.com/calendar/appointments/schedules/AcZssZ3BHMm-bB4d2pxtExODjOcPXXBuDWZ0x8Jf031ViCjCxnFs04QMuCKJT0Ltrhx4ujFplGVvywu1" class="nav-cta" target="_blank" rel="noopener">Book a Call</a>
  </div>
</nav>

<!-- Hero -->
<div class="hero">
  <h1>Client <span>Dashboards</span></h1>
  <p>Looking for yours? Email <a href="mailto:rachel@growthlever.app" class="email-link">rachel@growthlever.app</a> to get set up.</p>
  <a href="mailto:rachel@growthlever.app" class="cta-btn">Get in Touch</a>
</div>

<div class="footer">&copy; 2026 GrowthLever</div>
</body>
</html>
