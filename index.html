<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowthLever — Client Dashboards</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #F9FAFB; color: #1A2B4A; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
.logo { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
.logo span { color: #C54644; }
.subtitle { color: #6B7280; font-size: 1rem; margin-bottom: 3rem; }
.clients { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 400px; }
.client-card { display: flex; align-items: center; justify-content: space-between; background: white; border: 1px solid #E5E7EB; border-radius: 12px; padding: 1.25rem 1.5rem; text-decoration: none; color: #1A2B4A; transition: all 0.15s; }
.client-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-color: #C54644; transform: translateY(-1px); text-decoration: none; }
.client-name { font-weight: 700; font-size: 1.05rem; }
.client-desc { font-size: 0.8rem; color: #6B7280; margin-top: 0.2rem; }
.arrow { font-size: 1.25rem; color: #C54644; }
.footer { margin-top: 3rem; font-size: 0.8rem; color: #9CA3AF; }
</style>
</head>
<body>
<div class="logo">Growth<span>Lever</span></div>
<div class="subtitle">Client Content Dashboards</div>
<div class="clients">
  <a href="/55places/" class="client-card">
    <div>
      <div class="client-name">55Places</div>
      <div class="client-desc">55+ Active Adult Community Content — March 2026</div>
    </div>
    <div class="arrow">&rarr;</div>
  </a>
</div>
<div class="footer">&copy; 2026 GrowthLever</div>
</body>
</html>
